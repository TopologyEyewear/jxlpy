name: Packaging

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04,macos-15-intel]

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # Run cibuildwheel directly: its action pins the Node 20 based actions/setup-python@v5
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==2.23.3

    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
        CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_*"
        CIBW_ENVIRONMENT: "CMAKE_POLICY_VERSION_MINIMUM=3.5"
        CIBW_BEFORE_ALL: pip install "cmake>=3.5"
        CIBW_BEFORE_ALL_LINUX: yum install -y devtoolset-10-libatomic-devel
        CIBW_BUILD_VERBOSITY_LINUX: 3
        CIBW_BUILD_VERBOSITY_MACOS: 3
        CIBW_ARCHS_MACOS: "x86_64 arm64"
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {project}/tests
        # arm64 wheels are cross-compiled on the x86_64 runner and cannot run there
        CIBW_TEST_SKIP: "*-macosx_arm64"
    - uses: actions/upload-artifact@v6
      with:
        name: wheelhouse-${{ matrix.os }}
        path: ./wheelhouse/*.whl
